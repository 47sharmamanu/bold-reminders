name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Keeps the signing key the same between builds, so each new APK
      # installs as an update instead of needing an uninstall first.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bold-reminders-debug-keystore-v1

      # Only the app's own code is in the repo. `flutter create` fills in the
      # standard Android build files and never overwrites existing ones.
      - name: Generate Android build files
        run: flutter create . --platforms=android --org com.boldreminders --project-name bold_reminders

      - name: Apply app build settings
        run: |
          GRADLE=android/app/build.gradle.kts
          test -f "$GRADLE" || { echo "Expected $GRADLE"; ls android/app; exit 1; }
          cat >> "$GRADLE" <<'EOF'

          // ---- Bold Reminders settings (added by CI) ----
          android {
              defaultConfig {
                  minSdk = 26
              }
              val ksPath = System.getenv("BR_KEYSTORE_PATH")
              if (!ksPath.isNullOrBlank() && file(ksPath).exists()) {
                  signingConfigs {
                      create("brRelease") {
                          storeFile = file(ksPath)
                          storePassword = System.getenv("BR_KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("BR_KEY_ALIAS")
                          keyPassword = System.getenv("BR_KEYSTORE_PASSWORD")
                      }
                  }
                  buildTypes {
                      getByName("release") {
                          signingConfig = signingConfigs.getByName("brRelease")
                      }
                  }
              }
          }
          EOF
          tail -n 30 "$GRADLE"

      # Optional: a permanent release key stored in the repo's Actions secrets.
      - name: Load release key (if configured)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release key from secrets"
          else
            echo "No release key secret: using the cached build key"
          fi

      - name: Build APK
        env:
          BR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=0.1.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk bold-reminders.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" bold-reminders.apk \
            --title "Bold Reminders 0.1.${{ github.run_number }}" \
            --notes "Automatic build from commit ${GITHUB_SHA::7}. Install bold-reminders.apk on your phone." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: bold-reminders-apk
          path: bold-reminders.apk
